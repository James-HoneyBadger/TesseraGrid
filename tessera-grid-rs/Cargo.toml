[package]
name         = "tessera-grid"
version      = "6.1.0"
edition      = "2021"
rust-version = "1.95"
description  = "Tessera Grid – cellular automaton simulator (egui/Rust)"
license      = "MIT"

[[bin]]
name = "tessera"
path = "src/main.rs"

[dependencies]
eframe       = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "links", "persistence", "wayland", "x11"] }
egui         = "0.37"
egui_plot    = "0.38"
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
rand         = "0.10"
rayon        = "1.12"
image        = { version = "0.25.10", default-features = false, features = ["png", "gif"] }
rfd          = "0.17"
arboard      = "3.7"
clap         = { version = "4.6", features = ["derive"] }

[profile.release]
opt-level   = 3
lto         = true
codegen-units = 1
