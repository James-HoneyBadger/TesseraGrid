name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: tessera-linux-x86_64
            binary: tessera
          - os: windows-latest
            asset: tessera-windows-x86_64.exe
            binary: tessera.exe
          - os: macos-latest
            asset: tessera-macos-arm64
            binary: tessera
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GUI build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libudev-dev libgl1-mesa-dev
      - name: Build release binary
        run: cargo build --release --locked
        working-directory: tessera-grid-rs
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "tessera-grid-rs/target/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
      - name: Strip binary
        if: runner.os != 'Windows'
        run: strip -s "dist/${{ matrix.asset }}" || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tessera-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Tessera Grid ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
